<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 80">
  <defs>
    <radialGradient id="f-skin" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDDCB5"/>
      <stop offset="100%" stop-color="#F0A875"/>
    </radialGradient>
    <radialGradient id="f-head" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDDCB5"/>
      <stop offset="100%" stop-color="#ECA060"/>
    </radialGradient>
    <radialGradient id="f-jacket" cx="40%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </radialGradient>
    <radialGradient id="f-skirt" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </radialGradient>
    <filter id="f-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="20" cy="79" rx="11" ry="2.5" fill="#000" fill-opacity="0.35"/>

  <!-- ── BOOTS ── -->
  <!-- Left boot -->
  <rect x="5" y="66" width="12" height="13" rx="5" fill="#7C3AED"/>
  <rect x="5" y="66" width="12" height="5" rx="2.5" fill="#6D28D9"/>
  <!-- Boot highlight -->
  <rect x="6" y="67" width="5" height="3" rx="1.5" fill="white" fill-opacity="0.3"/>
  <!-- Right boot -->
  <rect x="23" y="66" width="12" height="13" rx="5" fill="#7C3AED"/>
  <rect x="23" y="66" width="12" height="5" rx="2.5" fill="#6D28D9"/>
  <rect x="24" y="67" width="5" height="3" rx="1.5" fill="white" fill-opacity="0.3"/>

  <!-- ── LEGS / STOCKINGS ── -->
  <rect x="6" y="55" width="11" height="13" rx="4" fill="#FDDCB5"/>
  <rect x="23" y="55" width="11" height="13" rx="4" fill="#FDDCB5"/>

  <!-- ── SKIRT ── -->
  <!-- Skirt flare -->
  <path d="M6 46 Q5 64 20 65 Q35 64 34 46 Z" fill="url(#f-skirt)"/>
  <!-- Skirt highlight fold -->
  <path d="M9 47 Q8 58 14 62" stroke="white" stroke-width="1.5" fill="none" fill-opacity="0" stroke-opacity="0.3" stroke-linecap="round"/>
  <!-- Waistband -->
  <rect x="8" y="43" width="24" height="6" rx="3" fill="#BE185D"/>
  <!-- Waistband shine -->
  <rect x="8" y="43" width="24" height="2.5" rx="1.5" fill="#EC4899" fill-opacity="0.5"/>

  <!-- ── JACKET / BODY ── -->
  <rect x="8" y="26" width="24" height="21" rx="5" fill="url(#f-jacket)"/>
  <!-- White collar/lapel -->
  <path d="M8 26 L15 33 L20 27 L25 33 L32 26" fill="white" fill-opacity="0.9"/>
  <!-- Ribbon bow at chest -->
  <!-- Left wing -->
  <path d="M16 31 Q13 28 15 32 Q13 36 16 34 L19 32 Z" fill="#EC4899"/>
  <!-- Right wing -->
  <path d="M24 31 Q27 28 25 32 Q27 36 24 34 L21 32 Z" fill="#EC4899"/>
  <!-- Bow center knot -->
  <ellipse cx="20" cy="32" rx="2" ry="2.5" fill="#F472B6"/>
  <!-- Jacket side trim (white piping) -->
  <rect x="7" y="26" width="2" height="21" rx="1" fill="white" fill-opacity="0.4"/>
  <rect x="31" y="26" width="2" height="21" rx="1" fill="white" fill-opacity="0.4"/>

  <!-- ── ARMS (jacket sleeves) ── -->
  <rect x="0" y="26" width="9" height="18" rx="4.5" fill="#06B6D4"/>
  <rect x="31" y="26" width="9" height="18" rx="4.5" fill="#06B6D4"/>
  <!-- Cuff trim -->
  <rect x="0" y="40" width="9" height="3.5" rx="1.75" fill="#0891B2"/>
  <rect x="31" y="40" width="9" height="3.5" rx="1.75" fill="#0891B2"/>
  <!-- Hands -->
  <circle cx="4.5" cy="45" r="4.5" fill="url(#f-skin)"/>
  <circle cx="35.5" cy="45" r="4.5" fill="url(#f-skin)"/>

  <!-- ── NECK ── -->
  <rect x="16" y="20" width="8" height="8" fill="url(#f-skin)"/>

  <!-- ── HEAD ── -->
  <circle cx="20" cy="14" r="14" fill="url(#f-head)" filter="url(#f-shadow)"/>

  <!-- ── HAIR (back layer, brown) ── -->
  <!-- Long back hair volume -->
  <ellipse cx="20" cy="12" rx="14" ry="11" fill="#92400E"/>
  <!-- Side hair falling down -->
  <rect x="5" y="12" width="6" height="20" rx="3" fill="#92400E"/>
  <rect x="29" y="12" width="6" height="20" rx="3" fill="#92400E"/>
  <!-- Hair shine highlight -->
  <path d="M8 6 Q14 3 21 5" stroke="#B45309" stroke-width="2.5" fill="none" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Top bun -->
  <circle cx="20" cy="2" r="5" fill="#92400E"/>

  <!-- ── BOW HAIR CLIP ── -->
  <!-- Left wing -->
  <path d="M14 2 Q9 -1 11 3 Q9 7 14 5 L19 3 Z" fill="#EC4899"/>
  <!-- Right wing -->
  <path d="M26 2 Q31 -1 29 3 Q31 7 26 5 L21 3 Z" fill="#EC4899"/>
  <!-- Bow center -->
  <ellipse cx="20" cy="3" rx="2.5" ry="2" fill="#F472B6"/>

  <!-- ── EARS ── -->
  <circle cx="6" cy="15" r="3" fill="url(#f-skin)"/>
  <circle cx="34" cy="15" r="3" fill="url(#f-skin)"/>
  <!-- Star earrings -->
  <circle cx="5.5" cy="18.5" r="1.5" fill="#F59E0B"/>
  <circle cx="34.5" cy="18.5" r="1.5" fill="#F59E0B"/>

  <!-- ── FACE ── -->
  <!-- Eyebrows (thin, curved) -->
  <path d="M11 11 Q14 9 17 11" stroke="#7B4F2E" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M23 11 Q26 9 29 11" stroke="#7B4F2E" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Eye whites (larger, more expressive) -->
  <ellipse cx="14" cy="16" rx="4" ry="4" fill="white"/>
  <ellipse cx="26" cy="16" rx="4" ry="4" fill="white"/>
  <!-- Iris (purple/violet) -->
  <circle cx="14" cy="16" r="2.8" fill="#7C3AED"/>
  <circle cx="26" cy="16" r="2.8" fill="#7C3AED"/>
  <!-- Pupil -->
  <circle cx="14" cy="16" r="1.6" fill="#1C1C1E"/>
  <circle cx="26" cy="16" r="1.6" fill="#1C1C1E"/>
  <!-- Shine -->
  <circle cx="15" cy="15" r="1" fill="white"/>
  <circle cx="27" cy="15" r="1" fill="white"/>
  <!-- Upper eyelashes -->
  <path d="M10 13 L11 11" stroke="#1C1C1E" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M12 12 L12.5 10" stroke="#1C1C1E" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M22 12 L22.5 10" stroke="#1C1C1E" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M24 13 L25 11" stroke="#1C1C1E" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Blush cheeks -->
  <ellipse cx="10" cy="19" rx="3" ry="1.5" fill="#FFB3B3" fill-opacity="0.65"/>
  <ellipse cx="30" cy="19" rx="3" ry="1.5" fill="#FFB3B3" fill-opacity="0.65"/>
  <!-- Smile -->
  <path d="M16 21 Q20 24 24 21" stroke="#C0897A" stroke-width="1.3" fill="none" stroke-linecap="round"/>
</svg>
